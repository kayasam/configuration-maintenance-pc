<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 654" width="900" height="654" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="spine-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <rect width="900" height="654" fill="#f8fafc"/>

  <text x="40" y="38" font-size="22" font-weight="700" fill="#1e293b">La séquence de démarrage</text>
  <text x="40" y="62" font-size="13" fill="#64748b">Chaque étape franchie élimine une famille de pannes — localiser l'étape, c'est isoler le problème.</text>

  <text x="68" y="100" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.8">ÉTAPE</text>
  <text x="500" y="100" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.8">SI CETTE ÉTAPE ÉCHOUE</text>

  <line x1="42" y1="141" x2="42" y2="612" stroke="#cbd5e1" stroke-width="2" marker-end="url(#spine-arrow)"/>

  <!-- 1 -->
  <rect x="68" y="112" width="400" height="58" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <text x="88" y="136" font-size="15" font-weight="700" fill="#1e293b">Mise sous tension</text>
  <text x="88" y="155" font-size="12" fill="#64748b">L'alimentation se stabilise et émet le signal Power Good</text>
  <rect x="500" y="112" width="372" height="58" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="520" y="146" font-size="12.5" fill="#dc2626">Aucune réaction : ni ventilateur, ni LED</text>
  <circle cx="42" cy="141" r="16" fill="#2563eb"/>
  <text x="42" y="146" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>

  <!-- 2 -->
  <rect x="68" y="188" width="400" height="58" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <text x="88" y="212" font-size="15" font-weight="700" fill="#1e293b">Exécution du firmware</text>
  <text x="88" y="231" font-size="12" fill="#64748b">Le processeur lit le BIOS/UEFI dans la puce flash</text>
  <rect x="500" y="188" width="372" height="58" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="520" y="222" font-size="12.5" fill="#dc2626">Écran noir, aucun signe de vie</text>
  <circle cx="42" cy="217" r="16" fill="#2563eb"/>
  <text x="42" y="222" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>

  <!-- 3 -->
  <rect x="68" y="264" width="400" height="58" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <text x="88" y="288" font-size="15" font-weight="700" fill="#1e293b">POST — autotest du matériel</text>
  <text x="88" y="307" font-size="12" fill="#64748b">Vérifie CPU, mémoire vive, carte graphique</text>
  <rect x="500" y="264" width="372" height="58" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="520" y="298" font-size="12.5" fill="#dc2626">Bips ou LED de diagnostic, pas de logo</text>
  <circle cx="42" cy="293" r="16" fill="#2563eb"/>
  <text x="42" y="298" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>

  <!-- 4 -->
  <rect x="68" y="340" width="400" height="58" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <text x="88" y="364" font-size="15" font-weight="700" fill="#1e293b">Détection des supports</text>
  <text x="88" y="383" font-size="12" fill="#64748b">Disques, clés USB, carte réseau</text>
  <rect x="500" y="340" width="372" height="58" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="520" y="374" font-size="12.5" fill="#dc2626">Le disque n'apparaît pas dans le setup</text>
  <circle cx="42" cy="369" r="16" fill="#2563eb"/>
  <text x="42" y="374" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>

  <!-- 5 -->
  <rect x="68" y="416" width="400" height="58" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <text x="88" y="440" font-size="15" font-weight="700" fill="#1e293b">Lecture de l'ordre de démarrage</text>
  <text x="88" y="459" font-size="12" fill="#64748b">Le firmware essaie chaque entrée, dans l'ordre</text>
  <rect x="500" y="416" width="372" height="58" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="520" y="450" font-size="12.5" fill="#dc2626">Démarrage sur le mauvais support</text>
  <circle cx="42" cy="445" r="16" fill="#2563eb"/>
  <text x="42" y="450" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>

  <!-- 6 -->
  <rect x="68" y="492" width="400" height="58" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <text x="88" y="516" font-size="15" font-weight="700" fill="#1e293b">Chargement de l'amorceur</text>
  <text x="88" y="535" font-size="12" fill="#64748b">Code du MBR (Legacy) ou fichier .efi sur l'ESP (UEFI)</text>
  <rect x="500" y="492" width="372" height="58" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="520" y="526" font-size="12.5" fill="#dc2626">No boot device found</text>
  <circle cx="42" cy="521" r="16" fill="#2563eb"/>
  <text x="42" y="526" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>

  <!-- 7 -->
  <rect x="68" y="568" width="400" height="58" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" filter="url(#card-shadow)"/>
  <text x="88" y="592" font-size="15" font-weight="700" fill="#1e293b">Lancement du système d'exploitation</text>
  <text x="88" y="611" font-size="12" fill="#64748b">Le firmware passe la main : sa mission est terminée</text>
  <rect x="500" y="568" width="372" height="58" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="520" y="602" font-size="12.5" fill="#dc2626">Écran bleu, boucle de redémarrage</text>
  <circle cx="42" cy="597" r="16" fill="#16a34a"/>
  <path d="M 35 597 l 5 5 l 10 -11" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
