<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="sp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#f8fafc"/>

  <text x="40" y="34" font-size="22" font-weight="700" fill="#1e293b">La chaîne d'impression et son point de blocage</text>
  <text x="40" y="57" font-size="13" fill="#64748b">Le spouleur met les documents en file d'attente. C'est là que la très grande majorité des pannes se produit.</text>

  <!-- 1 APPLICATION -->
  <rect x="40" y="86" width="150" height="90" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <rect x="66" y="106" width="40" height="30" rx="3" fill="#f1f5f9" stroke="#94a3b8"/>
  <line x1="72" y1="114" x2="100" y2="114" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="72" y1="121" x2="100" y2="121" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="72" y1="128" x2="92" y2="128" stroke="#cbd5e1" stroke-width="2"/>
  <text x="115" y="153" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">Application</text>
  <text x="115" y="169" font-size="10.5" fill="#64748b" text-anchor="middle">Word, navigateur…</text>
  <line x1="194" y1="131" x2="212" y2="131" stroke="#94a3b8" stroke-width="2" marker-end="url(#sp-arrow)"/>

  <!-- 2 PILOTE -->
  <rect x="216" y="86" width="150" height="90" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <circle cx="291" cy="120" r="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <path d="M 285 120 h 12 M 291 114 v 12" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  <text x="291" y="153" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">Pilote</text>
  <text x="291" y="169" font-size="10.5" fill="#64748b" text-anchor="middle">Traduit en PCL / PostScript</text>
  <line x1="370" y1="131" x2="388" y2="131" stroke="#94a3b8" stroke-width="2" marker-end="url(#sp-arrow)"/>

  <!-- 3 SPOULEUR -->
  <rect x="392" y="86" width="190" height="90" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#card-shadow)"/>
  <rect x="416" y="102" width="30" height="20" rx="2" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="422" y="108" width="30" height="20" rx="2" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="428" y="114" width="30" height="20" rx="2" fill="#ffffff" stroke="#94a3b8"/>
  <circle cx="492" cy="120" r="15" fill="#dc2626"/>
  <path d="M 486 114 l 12 12 M 498 114 l -12 12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="487" y="153" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">Spouleur</text>
  <text x="487" y="169" font-size="10.5" fill="#64748b" text-anchor="middle">File d'attente — le point de blocage</text>
  <line x1="586" y1="131" x2="604" y2="131" stroke="#94a3b8" stroke-width="2" marker-end="url(#sp-arrow)"/>

  <!-- 4 PORT -->
  <rect x="608" y="86" width="110" height="90" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <rect x="645" y="108" width="36" height="24" rx="3" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="663" y="124" font-size="9" fill="#64748b" text-anchor="middle">TCP/IP</text>
  <text x="663" y="153" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">Port</text>
  <text x="663" y="169" font-size="10.5" fill="#64748b" text-anchor="middle">USB ou réseau</text>
  <line x1="722" y1="131" x2="740" y2="131" stroke="#94a3b8" stroke-width="2" marker-end="url(#sp-arrow)"/>

  <!-- 5 IMPRIMANTE -->
  <rect x="744" y="86" width="115" height="90" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" filter="url(#card-shadow)"/>
  <rect x="783" y="104" width="38" height="24" rx="3" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <rect x="789" y="98" width="26" height="8" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="789" y="126" width="26" height="9" fill="#dcfce7" stroke="#16a34a"/>
  <text x="801" y="153" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">Imprimante</text>
  <text x="801" y="169" font-size="10.5" fill="#64748b" text-anchor="middle">Sortie papier</text>

  <!-- SYMPTOMES -->
  <rect x="40" y="200" width="405" height="128" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <text x="64" y="228" font-size="14" font-weight="700" fill="#1e293b">Symptômes d'un spouleur figé</text>
  <text x="64" y="254" font-size="12" fill="#64748b">• Les documents s'empilent sans jamais s'imprimer</text>
  <text x="64" y="275" font-size="12" fill="#64748b">• Impossible de supprimer un document de la file</text>
  <text x="64" y="296" font-size="12" fill="#64748b">• L'imprimante est allumée et répond au ping</text>
  <text x="64" y="317" font-size="12" fill="#64748b">• Relancer l'impression ne change rien</text>

  <!-- SOLUTION -->
  <rect x="456" y="200" width="403" height="128" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" filter="url(#card-shadow)"/>
  <text x="480" y="228" font-size="14" font-weight="700" fill="#15803d">La remise à zéro</text>
  <rect x="480" y="240" width="355" height="72" rx="8" fill="#0f172a"/>
  <text x="496" y="262" font-size="10" font-family="Consolas, monospace" fill="#e2e8f0">net stop spooler</text>
  <text x="496" y="280" font-size="10" font-family="Consolas, monospace" fill="#e2e8f0">del /Q /F /S %systemroot%\System32\spool\PRINTERS\*.*</text>
  <text x="496" y="298" font-size="10" font-family="Consolas, monospace" fill="#e2e8f0">net start spooler</text>

  <!-- NOTE -->
  <rect x="40" y="348" width="819" height="34" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="60" y="369" font-size="12.5" fill="#1e293b">Ces trois commandes, en invite <tspan font-weight="700">administrateur</tspan>, règlent une grande partie des tickets d'impression. À connaître par cœur.</text>

  <rect x="40" y="392" width="819" height="34" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="60" y="413" font-size="12.5" fill="#1e293b">Si le problème revient sans cesse : <tspan font-weight="700">pilote inadapté</tspan>, ou imprimante réseau en DHCP dont l'adresse change à chaque redémarrage.</text>
</svg>
