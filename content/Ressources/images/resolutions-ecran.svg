<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="500" fill="#f8fafc"/>

  <text x="40" y="34" font-size="22" font-weight="700" fill="#1e293b">Les résolutions d'écran, à l'échelle</text>
  <text x="40" y="57" font-size="13" fill="#64748b">Chaque palier double presque le nombre de pixels à afficher — et la charge sur la carte graphique.</text>

  <!-- 4K -->
  <rect x="40" y="102" width="600" height="338" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="632" y="122" font-size="13" font-weight="700" fill="#2563eb" text-anchor="end">4K / UHD</text>
  <text x="632" y="139" font-size="11" fill="#64748b" text-anchor="end">3840 × 2160</text>

  <!-- QHD -->
  <rect x="40" y="215" width="400" height="225" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="432" y="235" font-size="13" font-weight="700" fill="#1e40af" text-anchor="end">QHD / 1440p</text>
  <text x="432" y="252" font-size="11" fill="#64748b" text-anchor="end">2560 × 1440</text>

  <!-- FHD -->
  <rect x="40" y="271" width="300" height="169" fill="#bfdbfe" stroke="#1e40af" stroke-width="2"/>
  <text x="332" y="291" font-size="13" font-weight="700" fill="#1e40af" text-anchor="end">Full HD / 1080p</text>
  <text x="332" y="308" font-size="11" fill="#334155" text-anchor="end">1920 × 1080</text>

  <!-- HD -->
  <rect x="40" y="320" width="213" height="120" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
  <text x="245" y="340" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="end">HD</text>
  <text x="245" y="357" font-size="11" fill="#1e293b" text-anchor="end">1366 × 768</text>

  <!-- PANNEAU DROIT -->
  <rect x="664" y="102" width="196" height="78" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <text x="684" y="126" font-size="13" font-weight="700" fill="#1e293b">4K — 8,3 Mpx</text>
  <text x="684" y="146" font-size="11" fill="#64748b">Montage, CAO, grands écrans.</text>
  <text x="684" y="163" font-size="11" fill="#64748b">Exige une bonne carte graphique.</text>

  <rect x="664" y="190" width="196" height="78" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <text x="684" y="214" font-size="13" font-weight="700" fill="#1e293b">QHD — 3,7 Mpx</text>
  <text x="684" y="234" font-size="11" fill="#64748b">Le confort sur 27 pouces.</text>
  <text x="684" y="251" font-size="11" fill="#64748b">Bon compromis actuel.</text>

  <rect x="664" y="278" width="196" height="78" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#card-shadow)"/>
  <text x="684" y="302" font-size="13" font-weight="700" fill="#1e293b">Full HD — 2,1 Mpx</text>
  <text x="684" y="322" font-size="11" fill="#64748b">Le standard bureautique.</text>
  <text x="684" y="339" font-size="11" font-weight="700" fill="#2563eb">Suffisant jusqu'à 24".</text>

  <rect x="664" y="366" width="196" height="74" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <text x="684" y="390" font-size="13" font-weight="700" fill="#1e293b">HD — 1,0 Mpx</text>
  <text x="684" y="410" font-size="11" fill="#64748b">Portables d'entrée de gamme.</text>
  <text x="684" y="427" font-size="11" font-weight="700" fill="#d97706">À éviter en 2026.</text>

  <!-- NOTE -->
  <rect x="40" y="458" width="820" height="30" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="60" y="478" font-size="12" fill="#1e293b">Une 4K affiche <tspan font-weight="700">4 fois</tspan> les pixels d'une Full HD. Sur un 24 pouces, la différence est à peine visible — la taille de l'écran compte autant que la résolution.</text>
</svg>
