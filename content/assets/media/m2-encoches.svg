<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="450" fill="#f8fafc"/>

  <text x="40" y="34" font-size="22" font-weight="700" fill="#1e293b">Reconnaître un SSD M.2 : les encoches</text>
  <text x="40" y="57" font-size="13" fill="#64748b">L'encoche du connecteur donne un premier indice sur le bus utilisé par le disque.</text>

  <rect x="40" y="76" width="820" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>

  <!-- ===== CLÉ M ===== -->
  <text x="64" y="118" font-size="14" font-weight="700" fill="#1e293b">Clé M</text>
  <text x="64" y="136" font-size="11" fill="#64748b">une encoche, à droite</text>

  <path d="M 200 100 H 580 V 146 H 564 V 120 H 550 V 146 H 200 Z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="206" y="126" width="344" height="16" fill="#d97706"/>
  <rect x="564" y="126" width="10" height="16" fill="#d97706"/>

  <rect x="604" y="104" width="232" height="38" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="620" y="119" font-size="12.5" font-weight="700" fill="#15803d">NVMe — PCIe ×4</text>
  <text x="620" y="135" font-size="11" fill="#64748b">Le cas le plus courant aujourd'hui</text>

  <!-- ===== CLÉ B+M ===== -->
  <text x="64" y="208" font-size="14" font-weight="700" fill="#1e293b">Clé B+M</text>
  <text x="64" y="226" font-size="11" fill="#64748b">deux encoches</text>

  <path d="M 200 190 H 580 V 236 H 564 V 210 H 550 V 236 H 275 V 210 H 261 V 236 H 200 Z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="206" y="216" width="55" height="16" fill="#d97706"/>
  <rect x="275" y="216" width="275" height="16" fill="#d97706"/>
  <rect x="564" y="216" width="10" height="16" fill="#d97706"/>

  <rect x="604" y="194" width="232" height="38" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="620" y="209" font-size="12.5" font-weight="700" fill="#b45309">SATA, ou NVMe ×2</text>
  <text x="620" y="225" font-size="11" fill="#64748b">Ambigu — c'est ici qu'on se trompe</text>

  <!-- ===== CLÉ B ===== -->
  <text x="64" y="298" font-size="14" font-weight="700" fill="#1e293b">Clé B</text>
  <text x="64" y="316" font-size="11" fill="#64748b">une encoche, à gauche</text>

  <path d="M 200 280 H 580 V 326 H 275 V 300 H 261 V 326 H 200 Z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="206" y="306" width="55" height="16" fill="#d97706"/>
  <rect x="275" y="306" width="299" height="16" fill="#d97706"/>

  <rect x="604" y="284" width="232" height="38" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="620" y="299" font-size="12.5" font-weight="700" fill="#334155">SATA, ou PCIe ×2</text>
  <text x="620" y="315" font-size="11" fill="#64748b">Devenu rare</text>

  <!-- LONGUEURS -->
  <text x="64" y="360" font-size="11.5" fill="#64748b">Longueurs courantes : <tspan font-weight="700" fill="#1e293b">2280</tspan> (22 × 80 mm, standard) · 2242 · 2260 — le slot de la carte mère impose la longueur.</text>

  <!-- AVERTISSEMENT -->
  <rect x="40" y="396" width="820" height="34" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <circle cx="66" cy="413" r="11" fill="#dc2626"/>
  <path d="M 66 407 l 0 7 M 66 418 l 0 1" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="88" y="418" font-size="12.5" fill="#1e293b">L'encoche est un <tspan font-weight="700">indice, pas une preuve</tspan> : seule la référence du modèle, ou l'étiquette du disque, confirme SATA ou NVMe.</text>
</svg>
