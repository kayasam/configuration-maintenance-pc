<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="470" fill="#f8fafc"/>

  <text x="40" y="38" font-size="22" font-weight="700" fill="#1e293b">La partition EFI (ESP)</text>
  <text x="40" y="62" font-size="13" fill="#64748b">En mode UEFI, l'amorçage repose sur de vrais fichiers, rangés dans une partition dédiée.</text>

  <!-- BARRE DE DISQUE -->
  <text x="40" y="98" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.8">DISQUE SYSTÈME EN GPT</text>

  <rect x="40" y="110" width="120" height="70" rx="12" fill="#2563eb" filter="url(#card-shadow)"/>
  <text x="100" y="140" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">ESP</text>
  <text x="100" y="160" font-size="11" fill="#dbeafe" text-anchor="middle">FAT32 · 100-500 Mo</text>

  <rect x="166" y="110" width="96" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <text x="214" y="140" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">MSR</text>
  <text x="214" y="160" font-size="11" fill="#64748b" text-anchor="middle">réservé</text>

  <rect x="268" y="110" width="420" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <text x="478" y="140" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">Partition système — Windows (C:)</text>
  <text x="478" y="160" font-size="11" fill="#64748b" text-anchor="middle">NTFS</text>

  <rect x="694" y="110" width="166" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <text x="777" y="140" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">Récupération</text>
  <text x="777" y="160" font-size="11" fill="#64748b" text-anchor="middle">WinRE</text>

  <!-- LIEN VERS LE CONTENU -->
  <path d="M 100 180 L 100 214" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 100 220 l -6 -8 l 12 0 z" fill="#2563eb"/>

  <!-- CONTENU DE L'ESP -->
  <rect x="40" y="222" width="480" height="180" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <rect x="40" y="222" width="480" height="40" rx="16" fill="#2563eb"/>
  <rect x="40" y="246" width="480" height="16" fill="#2563eb"/>
  <text x="62" y="249" font-size="14" font-weight="700" fill="#ffffff">Contenu de la partition ESP</text>

  <text x="62" y="290" font-size="13" font-family="Consolas, 'Courier New', monospace" font-weight="700" fill="#1e293b">EFI/</text>
  <g stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round">
    <path d="M 72 298 L 72 358"/>
    <path d="M 72 310 L 86 310"/>
    <path d="M 72 334 L 86 334"/>
    <path d="M 72 358 L 86 358"/>
  </g>
  <text x="92" y="314" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#1e293b">Microsoft/Boot/bootmgfw.efi</text>
  <text x="92" y="338" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#1e293b">ubuntu/grubx64.efi</text>
  <text x="92" y="362" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#1e293b">BOOT/BOOTX64.EFI</text>
  <text x="330" y="314" font-size="11.5" fill="#64748b">← Windows</text>
  <text x="330" y="338" font-size="11.5" fill="#64748b">← Ubuntu</text>
  <text x="330" y="362" font-size="11.5" fill="#64748b">← amorceur de secours</text>
  <text x="62" y="386" font-size="11.5" fill="#64748b">Un fichier .efi par système installé sur la machine.</text>

  <!-- NVRAM -->
  <rect x="540" y="222" width="320" height="180" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <rect x="540" y="222" width="320" height="40" rx="16" fill="#64748b"/>
  <rect x="540" y="246" width="320" height="16" fill="#64748b"/>
  <text x="562" y="249" font-size="14" font-weight="700" fill="#ffffff">NVRAM de la carte mère</text>

  <text x="562" y="288" font-size="12.5" fill="#1e293b">Le firmware y mémorise la liste des</text>
  <text x="562" y="308" font-size="12.5" fill="#1e293b">systèmes installés :</text>
  <rect x="562" y="322" width="276" height="26" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="576" y="340" font-size="12" fill="#2563eb">Windows Boot Manager</text>
  <rect x="562" y="354" width="276" height="26" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="576" y="372" font-size="12" fill="#2563eb">ubuntu</text>

  <!-- AVERTISSEMENT -->
  <rect x="40" y="418" width="820" height="34" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <circle cx="66" cy="435" r="11" fill="#dc2626"/>
  <path d="M 66 429 l 0 7 M 66 440 l 0 1" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="88" y="440" font-size="12.5" fill="#1e293b">Formater ou supprimer l'ESP rend <tspan font-weight="700">tous</tspan> les systèmes du disque non démarrables, même intacts.</text>
</svg>
