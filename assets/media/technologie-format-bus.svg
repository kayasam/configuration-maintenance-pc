<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="470" fill="#f8fafc"/>

  <text x="40" y="34" font-size="22" font-weight="700" fill="#1e293b">Technologie, format et bus : trois critères indépendants</text>
  <text x="40" y="57" font-size="13" fill="#64748b">Décrire un disque, c'est faire un choix sur chacun des trois axes. Aucun n'impose les autres.</text>

  <!-- COLONNE 1 : TECHNOLOGIE -->
  <rect x="40" y="76" width="260" height="196" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <path d="M 40 92 a 16 16 0 0 1 16 -16 h 228 a 16 16 0 0 1 16 16 v 28 h -260 z" fill="#2563eb"/>
  <circle cx="66" cy="98" r="12" fill="#ffffff" fill-opacity="0.25"/>
  <text x="66" y="103" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="88" y="103" font-size="15" font-weight="700" fill="#ffffff">TECHNOLOGIE</text>
  <text x="64" y="138" font-size="11.5" fill="#64748b">Comment les données sont stockées</text>
  <rect x="64" y="150" width="212" height="44" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="80" y="170" font-size="13.5" font-weight="700" fill="#1e40af">HDD</text>
  <text x="80" y="187" font-size="11" fill="#64748b">Plateaux magnétiques</text>
  <rect x="64" y="204" width="212" height="44" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="80" y="224" font-size="13.5" font-weight="700" fill="#1e40af">SSD</text>
  <text x="80" y="241" font-size="11" fill="#64748b">Mémoire flash</text>

  <!-- COLONNE 2 : FORMAT -->
  <rect x="320" y="76" width="260" height="196" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <path d="M 320 92 a 16 16 0 0 1 16 -16 h 228 a 16 16 0 0 1 16 16 v 28 h -260 z" fill="#2563eb"/>
  <circle cx="346" cy="98" r="12" fill="#ffffff" fill-opacity="0.25"/>
  <text x="346" y="103" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="368" y="103" font-size="15" font-weight="700" fill="#ffffff">FORMAT</text>
  <text x="344" y="138" font-size="11.5" fill="#64748b">Taille et forme physique</text>
  <rect x="344" y="150" width="212" height="30" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="360" y="170" font-size="12.5" font-weight="700" fill="#1e40af">3,5 pouces</text>
  <rect x="344" y="186" width="212" height="30" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="360" y="206" font-size="12.5" font-weight="700" fill="#1e40af">2,5 pouces</text>
  <rect x="344" y="222" width="212" height="30" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="360" y="242" font-size="12.5" font-weight="700" fill="#1e40af">M.2</text>

  <!-- COLONNE 3 : BUS -->
  <rect x="600" y="76" width="260" height="196" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <path d="M 600 92 a 16 16 0 0 1 16 -16 h 228 a 16 16 0 0 1 16 16 v 28 h -260 z" fill="#2563eb"/>
  <circle cx="626" cy="98" r="12" fill="#ffffff" fill-opacity="0.25"/>
  <text x="626" y="103" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="648" y="103" font-size="15" font-weight="700" fill="#ffffff">BUS</text>
  <text x="624" y="138" font-size="11.5" fill="#64748b">Comment il communique avec le système</text>
  <rect x="624" y="150" width="212" height="44" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="640" y="170" font-size="13.5" font-weight="700" fill="#1e40af">SATA</text>
  <text x="640" y="187" font-size="11" fill="#64748b">~550 Mo/s</text>
  <rect x="624" y="204" width="212" height="44" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="640" y="224" font-size="13.5" font-weight="700" fill="#1e40af">PCIe / NVMe</text>
  <text x="640" y="241" font-size="11" fill="#64748b">3,5 à 14 Go/s selon la génération</text>

  <!-- EXEMPLES -->
  <rect x="40" y="292" width="820" height="146" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <text x="64" y="322" font-size="15" font-weight="700" fill="#1e293b">Deux disques d'apparence identique, aux performances très différentes</text>

  <rect x="64" y="336" width="380" height="42" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="80" y="362" font-size="12.5" fill="#1e293b">SSD · M.2 · <tspan font-weight="700" fill="#d97706">SATA</tspan> → plafonné à 550 Mo/s</text>

  <rect x="456" y="336" width="380" height="42" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="472" y="362" font-size="12.5" fill="#1e293b">SSD · M.2 · <tspan font-weight="700" fill="#16a34a">NVMe</tspan> → jusqu'à 14 Go/s</text>

  <rect x="64" y="390" width="772" height="32" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <circle cx="88" cy="406" r="11" fill="#dc2626"/>
  <path d="M 88 400 l 0 7 M 88 411 l 0 1" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="110" y="411" font-size="12.5" fill="#1e293b">Même technologie, même format — seul le bus change. <tspan font-weight="700">M.2 ne veut pas dire NVMe.</tspan></text>
</svg>
