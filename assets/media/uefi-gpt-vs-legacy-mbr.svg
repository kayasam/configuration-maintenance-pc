<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="560" fill="#f8fafc"/>

  <text x="40" y="38" font-size="22" font-weight="700" fill="#1e293b">Mode de démarrage et table de partition</text>
  <text x="40" y="62" font-size="13" fill="#64748b">Les deux réglages vont par paire. Une incohérence ici explique la majorité des échecs d'installation.</text>

  <!-- CARTE GAUCHE : UEFI + GPT -->
  <rect x="40" y="86" width="400" height="250" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <rect x="40" y="86" width="400" height="46" rx="16" fill="#2563eb"/>
  <rect x="40" y="116" width="400" height="16" fill="#2563eb"/>
  <text x="64" y="115" font-size="16" font-weight="700" fill="#ffffff">UEFI + GPT</text>
  <circle cx="410" cy="109" r="14" fill="#16a34a"/>
  <path d="M 403 109 l 5 5 l 10 -11" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="64" y="162" font-size="12.5" font-weight="700" fill="#16a34a">LE STANDARD ACTUEL</text>

  <text x="64" y="190" font-size="13.5" fill="#1e293b">• Disques de plus de 2,2 To pris en charge</text>
  <text x="64" y="214" font-size="13.5" fill="#1e293b">• Jusqu'à 128 partitions</text>
  <text x="64" y="238" font-size="13.5" fill="#1e293b">• Amorçage par fichiers .efi sur la partition ESP</text>
  <text x="64" y="262" font-size="13.5" fill="#1e293b">• Secure Boot et TPM disponibles</text>
  <text x="64" y="286" font-size="13.5" fill="#1e293b">• Démarrage plus rapide</text>
  <text x="64" y="314" font-size="12.5" font-weight="700" fill="#2563eb">Obligatoire pour Windows 11</text>

  <!-- CARTE DROITE : Legacy + MBR -->
  <rect x="460" y="86" width="400" height="250" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <rect x="460" y="86" width="400" height="46" rx="16" fill="#d97706"/>
  <rect x="460" y="116" width="400" height="16" fill="#d97706"/>
  <text x="484" y="115" font-size="16" font-weight="700" fill="#ffffff">Legacy / CSM + MBR</text>

  <text x="484" y="162" font-size="12.5" font-weight="700" fill="#d97706">MODE DE COMPATIBILITÉ</text>

  <text x="484" y="190" font-size="13.5" fill="#1e293b">• Limité à 2,2 To par disque</text>
  <text x="484" y="214" font-size="13.5" fill="#1e293b">• 4 partitions principales maximum</text>
  <text x="484" y="238" font-size="13.5" fill="#1e293b">• Amorçage par code brut dans le MBR</text>
  <text x="484" y="262" font-size="13.5" fill="#1e293b">• Aucune sécurité au démarrage</text>
  <text x="484" y="286" font-size="13.5" fill="#1e293b">• Absent des cartes mères récentes</text>
  <text x="484" y="314" font-size="12.5" font-weight="700" fill="#64748b">Réservé au matériel ancien</text>

  <!-- BANDEAU DES COMBINAISONS IMPOSSIBLES -->
  <rect x="40" y="368" width="820" height="152" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <text x="64" y="400" font-size="15" font-weight="700" fill="#1e293b">Les deux combinaisons qui ne démarreront jamais</text>

  <rect x="64" y="418" width="380" height="80" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <circle cx="98" cy="458" r="16" fill="#dc2626"/>
  <path d="M 92 452 l 12 12 M 104 452 l -12 12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="128" y="452" font-size="14" font-weight="700" fill="#1e293b">Firmware en UEFI pur + disque MBR</text>
  <text x="128" y="474" font-size="12" fill="#64748b">Le disque est vu, mais aucun amorceur n'est trouvé</text>

  <rect x="456" y="418" width="380" height="80" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <circle cx="490" cy="458" r="16" fill="#dc2626"/>
  <path d="M 484 452 l 12 12 M 496 452 l -12 12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="520" y="452" font-size="14" font-weight="700" fill="#1e293b">Firmware en Legacy/CSM + disque GPT</text>
  <text x="520" y="474" font-size="12" fill="#64748b">Le BIOS ne sait pas lire une table GPT</text>
</svg>
