<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="dn-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#f8fafc"/>

  <text x="40" y="34" font-size="22" font-weight="700" fill="#1e293b">Diagnostiquer une panne réseau : l'échelle du ping</text>
  <text x="40" y="57" font-size="13" fill="#64748b">On teste de plus en plus loin. La première étape qui échoue désigne le composant fautif.</text>

  <text x="72" y="86" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.8">ON TESTE</text>
  <text x="530" y="86" font-size="11" font-weight="700" fill="#dc2626" letter-spacing="0.8">SI ÇA ÉCHOUE ICI</text>

  <line x1="48" y1="118" x2="48" y2="530" stroke="#bbf7d0" stroke-width="3"/>

  <!-- 1 -->
  <circle cx="48" cy="118" r="14" fill="#16a34a"/>
  <text x="48" y="123" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="76" y="96" width="430" height="60" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <text x="96" y="118" font-size="12.5" font-family="Consolas, monospace" fill="#1e293b">ipconfig /all</text>
  <text x="96" y="138" font-size="11.5" fill="#64748b">Ai-je seulement une adresse IP cohérente ?</text>
  <rect x="530" y="96" width="329" height="60" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="550" y="118" font-size="11.5" fill="#dc2626">Pas d'IP, ou une adresse en 169.254.x.x</text>
  <text x="550" y="138" font-size="11" fill="#64748b">→ câble, carte désactivée, ou DHCP injoignable</text>

  <!-- 2 -->
  <circle cx="48" cy="200" r="14" fill="#16a34a"/>
  <text x="48" y="205" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="76" y="178" width="430" height="60" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <text x="96" y="200" font-size="12.5" font-family="Consolas, monospace" fill="#1e293b">ping 127.0.0.1</text>
  <text x="96" y="220" font-size="11.5" fill="#64748b">Ma propre pile réseau fonctionne-t-elle ?</text>
  <rect x="530" y="178" width="329" height="60" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="550" y="200" font-size="11.5" fill="#dc2626">Échec du bouclage local</text>
  <text x="550" y="220" font-size="11" fill="#64748b">→ pilote réseau ou Windows en cause, pas le réseau</text>

  <!-- 3 -->
  <circle cx="48" cy="282" r="14" fill="#16a34a"/>
  <text x="48" y="287" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="76" y="260" width="430" height="60" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <text x="96" y="282" font-size="12.5" font-family="Consolas, monospace" fill="#1e293b">ping 192.168.56.1</text>
  <text x="96" y="302" font-size="11.5" fill="#64748b">J'atteins ma passerelle : le réseau local est-il bon ?</text>
  <rect x="530" y="260" width="329" height="60" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="550" y="282" font-size="11.5" fill="#dc2626">Passerelle injoignable</text>
  <text x="550" y="302" font-size="11" fill="#64748b">→ câble, switch, Wi-Fi, ou mauvais masque</text>

  <!-- 4 -->
  <circle cx="48" cy="364" r="14" fill="#16a34a"/>
  <text x="48" y="369" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="76" y="342" width="430" height="60" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <text x="96" y="364" font-size="12.5" font-family="Consolas, monospace" fill="#1e293b">ping 8.8.8.8</text>
  <text x="96" y="384" font-size="11.5" fill="#64748b">Je sors du réseau local : Internet répond-il ?</text>
  <rect x="530" y="342" width="329" height="60" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="550" y="364" font-size="11.5" fill="#dc2626">Le local marche, mais pas la sortie</text>
  <text x="550" y="384" font-size="11" fill="#64748b">→ passerelle mal configurée, box, ou pare-feu</text>

  <!-- 5 -->
  <circle cx="48" cy="446" r="14" fill="#d97706"/>
  <text x="48" y="451" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="76" y="424" width="430" height="60" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.5" filter="url(#card-shadow)"/>
  <text x="96" y="446" font-size="12.5" font-family="Consolas, monospace" fill="#1e293b">ping google.com</text>
  <text x="96" y="466" font-size="11.5" fill="#64748b">Les noms sont-ils traduits en adresses ?</text>
  <rect x="530" y="424" width="329" height="60" rx="12" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="550" y="446" font-size="11.5" font-weight="700" fill="#b45309">L'étape 4 passe mais pas celle-ci → DNS</text>
  <text x="550" y="466" font-size="11" fill="#64748b">→ le cas le plus fréquent. Vérifier avec nslookup</text>

  <!-- 6 OK -->
  <circle cx="48" cy="528" r="14" fill="#16a34a"/>
  <path d="M 41 528 l 5 5 l 10 -11" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="76" y="506" width="430" height="46" rx="12" fill="#dcfce7" stroke="#86efac"/>
  <text x="96" y="534" font-size="12.5" font-weight="700" fill="#15803d">Tout passe : la connectivité est complète.</text>

  <rect x="530" y="506" width="329" height="46" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="550" y="527" font-size="11.5" fill="#1e293b">Ping IP <tspan font-weight="700">OK</tspan> + ping nom <tspan font-weight="700" fill="#dc2626">KO</tspan></text>
  <text x="550" y="544" font-size="11.5" font-weight="700" fill="#2563eb">= toujours le DNS</text>
</svg>
