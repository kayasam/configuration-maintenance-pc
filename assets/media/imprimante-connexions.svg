<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="900" height="470" fill="#f8fafc"/>

  <text x="40" y="34" font-size="22" font-weight="700" fill="#1e293b">Quatre façons de connecter une imprimante</text>
  <text x="40" y="57" font-size="13" fill="#64748b">Le mode de connexion détermine qui peut imprimer — et quelles pannes vous rencontrerez.</text>

  <!-- ===== 1. USB DIRECT ===== -->
  <rect x="40" y="80" width="197" height="316" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <path d="M 40 96 a 16 16 0 0 1 16 -16 h 165 a 16 16 0 0 1 16 16 v 26 h -197 z" fill="#64748b"/>
  <text x="62" y="108" font-size="14" font-weight="700" fill="#ffffff">USB direct</text>

  <rect x="98" y="140" width="80" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="138" y="160" font-size="11" fill="#1e293b" text-anchor="middle">1 poste</text>
  <line x1="138" y1="170" x2="138" y2="196" stroke="#94a3b8" stroke-width="2"/>
  <rect x="98" y="196" width="80" height="30" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="138" y="216" font-size="11" fill="#2563eb" text-anchor="middle">Imprimante</text>

  <text x="62" y="256" font-size="11.5" fill="#16a34a" font-weight="700">+ Simple et fiable</text>
  <text x="62" y="276" font-size="11.5" fill="#16a34a" font-weight="700">+ Aucune configuration</text>
  <text x="62" y="300" font-size="11.5" fill="#dc2626" font-weight="700">− Un seul poste</text>
  <text x="62" y="332" font-size="11" fill="#64748b">Panne typique :</text>
  <text x="62" y="349" font-size="11" fill="#64748b">câble ou pilote.</text>

  <!-- ===== 2. RESEAU TCP/IP ===== -->
  <rect x="248" y="80" width="197" height="316" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#card-shadow)"/>
  <path d="M 248 96 a 16 16 0 0 1 16 -16 h 165 a 16 16 0 0 1 16 16 v 26 h -197 z" fill="#2563eb"/>
  <text x="270" y="108" font-size="14" font-weight="700" fill="#ffffff">Réseau (TCP/IP)</text>

  <rect x="266" y="140" width="52" height="26" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="292" y="157" font-size="10" fill="#1e293b" text-anchor="middle">Poste</text>
  <rect x="326" y="140" width="52" height="26" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="352" y="157" font-size="10" fill="#1e293b" text-anchor="middle">Poste</text>
  <rect x="386" y="140" width="42" height="26" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="407" y="157" font-size="10" fill="#1e293b" text-anchor="middle">Poste</text>
  <line x1="292" y1="166" x2="292" y2="182" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="352" y1="166" x2="352" y2="182" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="407" y1="166" x2="407" y2="182" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="292" y1="182" x2="407" y2="182" stroke="#2563eb" stroke-width="2"/>
  <line x1="347" y1="182" x2="347" y2="196" stroke="#2563eb" stroke-width="2"/>
  <rect x="307" y="196" width="80" height="30" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="347" y="216" font-size="11" fill="#2563eb" text-anchor="middle">Imprimante</text>

  <text x="270" y="252" font-size="11.5" fill="#16a34a" font-weight="700">+ Tous les postes</text>
  <text x="270" y="270" font-size="11.5" fill="#16a34a" font-weight="700">+ Ethernet ou Wi-Fi</text>
  <text x="270" y="288" font-size="11.5" fill="#16a34a" font-weight="700">+ Aucun poste hôte</text>
  <text x="270" y="310" font-size="11.5" fill="#dc2626" font-weight="700">− Exige une IP fixe</text>
  <text x="270" y="332" font-size="11" fill="#64748b">Panne typique :</text>
  <text x="270" y="349" font-size="11" fill="#64748b">l'adresse IP a changé.</text>
  <rect x="270" y="358" width="153" height="24" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="346" y="374" font-size="10.5" font-weight="700" fill="#15803d" text-anchor="middle">Le choix en entreprise</text>

  <!-- ===== 3. PARTAGEE ===== -->
  <rect x="456" y="80" width="197" height="316" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <path d="M 456 96 a 16 16 0 0 1 16 -16 h 165 a 16 16 0 0 1 16 16 v 26 h -197 z" fill="#64748b"/>
  <text x="478" y="108" font-size="14" font-weight="700" fill="#ffffff">Partagée</text>

  <rect x="474" y="140" width="52" height="26" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="500" y="157" font-size="10" fill="#1e293b" text-anchor="middle">Poste</text>
  <rect x="592" y="140" width="52" height="26" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="618" y="157" font-size="10" fill="#1e293b" text-anchor="middle">Poste</text>
  <line x1="500" y1="166" x2="530" y2="182" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="618" y1="166" x2="588" y2="182" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="519" y="182" width="80" height="28" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="559" y="200" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">Poste hôte</text>
  <line x1="559" y1="210" x2="559" y2="224" stroke="#94a3b8" stroke-width="2"/>
  <rect x="519" y="224" width="80" height="28" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="559" y="242" font-size="10.5" fill="#2563eb" text-anchor="middle">Imprimante</text>

  <text x="478" y="278" font-size="11.5" fill="#16a34a" font-weight="700">+ Aucune config réseau</text>
  <text x="478" y="302" font-size="11.5" fill="#dc2626" font-weight="700">− L'hôte doit rester</text>
  <text x="478" y="318" font-size="11.5" fill="#dc2626" font-weight="700">  allumé en permanence</text>
  <text x="478" y="345" font-size="11" fill="#64748b">Panne typique : le poste</text>
  <text x="478" y="362" font-size="11" fill="#64748b">hôte est éteint ou en veille.</text>

  <!-- ===== 4. WI-FI DIRECT ===== -->
  <rect x="664" y="80" width="195" height="316" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <path d="M 664 96 a 16 16 0 0 1 16 -16 h 163 a 16 16 0 0 1 16 16 v 26 h -195 z" fill="#64748b"/>
  <text x="686" y="108" font-size="14" font-weight="700" fill="#ffffff">Wi-Fi Direct</text>

  <rect x="726" y="140" width="70" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="761" y="159" font-size="10.5" fill="#1e293b" text-anchor="middle">1 appareil</text>
  <path d="M 747 180 a 20 20 0 0 1 28 0" stroke="#2563eb" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 752 188 a 13 13 0 0 1 18 0" stroke="#2563eb" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="761" cy="196" r="2.5" fill="#2563eb"/>
  <rect x="721" y="206" width="80" height="28" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="761" y="224" font-size="10.5" fill="#2563eb" text-anchor="middle">Imprimante</text>
  <rect x="686" y="242" width="151" height="20" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="761" y="256" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">Ni box, ni réseau local</text>

  <text x="686" y="284" font-size="11.5" fill="#16a34a" font-weight="700">+ Aucune infrastructure</text>
  <text x="686" y="302" font-size="11.5" fill="#16a34a" font-weight="700">+ Visiteurs, dépannage</text>
  <text x="686" y="324" font-size="11.5" fill="#dc2626" font-weight="700">− Un appareil à la fois</text>
  <text x="686" y="342" font-size="11.5" fill="#dc2626" font-weight="700">− Hors gestion du parc</text>
  <text x="686" y="364" font-size="11" fill="#64748b">Panne typique : l'appareil</text>
  <text x="686" y="380" font-size="11" fill="#64748b">perd Internet en s'y reliant.</text>

  <!-- NOTE -->
  <rect x="40" y="412" width="819" height="34" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <circle cx="66" cy="429" r="11" fill="#dc2626"/>
  <path d="M 66 423 l 0 7 M 66 434 l 0 1" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="88" y="434" font-size="12.5" fill="#1e293b">Une imprimante réseau en <tspan font-weight="700">DHCP</tspan> change d'adresse au redémarrage : tous les postes la voient « hors connexion ». IP fixe ou réservation DHCP.</text>
</svg>
