<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="ren-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="#f8fafc"/>

  <text x="40" y="34" font-size="22" font-weight="700" fill="#1e293b">USB : le même débit, trois noms différents</text>
  <text x="40" y="57" font-size="13" fill="#64748b">L'USB-IF a renommé ses normes deux fois sans retirer les anciens noms. Seul le débit est fiable.</text>

  <text x="40" y="92" font-size="10.5" font-weight="700" fill="#2563eb" letter-spacing="0.7">DÉBIT RÉEL</text>
  <text x="180" y="92" font-size="10.5" font-weight="700" fill="#64748b" letter-spacing="0.7">NOM D'ORIGINE</text>
  <text x="410" y="92" font-size="10.5" font-weight="700" fill="#64748b" letter-spacing="0.7">1ᵉʳ RENOMMAGE</text>
  <text x="640" y="92" font-size="10.5" font-weight="700" fill="#64748b" letter-spacing="0.7">NOM ACTUEL</text>

  <!-- LIGNE 480 Mbps -->
  <rect x="40" y="104" width="120" height="56" rx="12" fill="#64748b"/>
  <text x="100" y="130" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">480</text>
  <text x="100" y="147" font-size="10.5" fill="#e2e8f0" text-anchor="middle">Mbit/s</text>
  <rect x="180" y="104" width="210" height="56" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <text x="285" y="138" font-size="13" fill="#1e293b" text-anchor="middle">USB 2.0</text>
  <rect x="410" y="104" width="210" height="56" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="515" y="138" font-size="12" fill="#94a3b8" text-anchor="middle">inchangé</text>
  <rect x="640" y="104" width="219" height="56" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <text x="749" y="138" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">USB 2.0</text>

  <!-- LIGNE 5 Gbps -->
  <rect x="40" y="176" width="120" height="56" rx="12" fill="#2563eb"/>
  <text x="100" y="202" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="100" y="219" font-size="10.5" fill="#dbeafe" text-anchor="middle">Gbit/s</text>
  <rect x="180" y="176" width="210" height="56" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <text x="285" y="210" font-size="13" fill="#1e293b" text-anchor="middle">USB 3.0</text>
  <line x1="394" y1="204" x2="406" y2="204" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ren-arrow)"/>
  <rect x="410" y="176" width="210" height="56" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <text x="515" y="210" font-size="13" fill="#1e293b" text-anchor="middle">USB 3.1 Gen 1</text>
  <line x1="624" y1="204" x2="636" y2="204" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ren-arrow)"/>
  <rect x="640" y="176" width="219" height="56" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#card-shadow)"/>
  <text x="749" y="203" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">USB 3.2 Gen 1</text>
  <text x="749" y="220" font-size="10.5" fill="#2563eb" text-anchor="middle">alias « USB 5Gbps »</text>

  <!-- LIGNE 10 Gbps -->
  <rect x="40" y="248" width="120" height="56" rx="12" fill="#2563eb"/>
  <text x="100" y="274" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">10</text>
  <text x="100" y="291" font-size="10.5" fill="#dbeafe" text-anchor="middle">Gbit/s</text>
  <rect x="180" y="248" width="210" height="56" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <text x="285" y="282" font-size="13" fill="#1e293b" text-anchor="middle">USB 3.1</text>
  <line x1="394" y1="276" x2="406" y2="276" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ren-arrow)"/>
  <rect x="410" y="248" width="210" height="56" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <text x="515" y="282" font-size="13" fill="#1e293b" text-anchor="middle">USB 3.1 Gen 2</text>
  <line x1="624" y1="276" x2="636" y2="276" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ren-arrow)"/>
  <rect x="640" y="248" width="219" height="56" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#card-shadow)"/>
  <text x="749" y="275" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">USB 3.2 Gen 2</text>
  <text x="749" y="292" font-size="10.5" fill="#2563eb" text-anchor="middle">alias « USB 10Gbps »</text>

  <!-- LIGNE 20 Gbps -->
  <rect x="40" y="320" width="120" height="56" rx="12" fill="#1e40af"/>
  <text x="100" y="346" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">20</text>
  <text x="100" y="363" font-size="10.5" fill="#dbeafe" text-anchor="middle">Gbit/s</text>
  <rect x="180" y="320" width="210" height="56" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="285" y="354" font-size="12" fill="#94a3b8" text-anchor="middle">n'existait pas</text>
  <rect x="410" y="320" width="210" height="56" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <text x="515" y="354" font-size="13" fill="#1e293b" text-anchor="middle">USB 3.2 Gen 2×2</text>
  <line x1="624" y1="348" x2="636" y2="348" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ren-arrow)"/>
  <rect x="640" y="320" width="219" height="56" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#card-shadow)"/>
  <text x="749" y="354" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">USB 20Gbps</text>

  <!-- LIGNE 40 Gbps -->
  <rect x="40" y="392" width="120" height="56" rx="12" fill="#1e40af"/>
  <text x="100" y="418" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">40</text>
  <text x="100" y="435" font-size="10.5" fill="#dbeafe" text-anchor="middle">Gbit/s</text>
  <rect x="180" y="392" width="210" height="56" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="285" y="426" font-size="12" fill="#94a3b8" text-anchor="middle">n'existait pas</text>
  <rect x="410" y="392" width="210" height="56" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="515" y="426" font-size="12" fill="#94a3b8" text-anchor="middle">n'existait pas</text>
  <rect x="640" y="392" width="219" height="56" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#card-shadow)"/>
  <text x="749" y="419" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">USB4 / Thunderbolt</text>
  <text x="749" y="436" font-size="10.5" fill="#2563eb" text-anchor="middle">alias « USB 40Gbps »</text>

  <!-- NOTE -->
  <rect x="40" y="466" width="819" height="34" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <circle cx="66" cy="483" r="11" fill="#dc2626"/>
  <path d="M 66 477 l 0 7 M 66 488 l 0 1" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="88" y="488" font-size="12.5" fill="#1e293b">Sur une fiche technique, <tspan font-weight="700">« USB 3.2 » seul ne veut rien dire</tspan> : ce peut être 5, 10 ou 20 Gbit/s. Toujours chercher le débit annoncé.</text>
</svg>
