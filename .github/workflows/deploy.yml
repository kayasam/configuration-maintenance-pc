name: Deploy Configuration Maintenance PC to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Fix folder-page links in the local graph
        run: node scripts/fix-quartz-graph.mjs

      - name: Build Quartz
        run: node quartz/bootstrap-cli.mjs build

      - name: Publish interactive HTML courses
        run: |
          find content/cours -type f -name "*.html" -print0 | while IFS= read -r -d '' file; do
            relative_path="${file#content/}"
            mkdir -p "public/$(dirname "$relative_path")"
            cp "$file" "public/$relative_path"
          done
          mkdir -p public/assets
          cp -R content/assets/. public/assets/

      - name: Publish individual Markdown downloads
        run: |
          mkdir -p public/telechargements/cours public/telechargements/tp
          find content -mindepth 2 -maxdepth 2 -type f -name "index.md" -path "content/[0-9][0-9]-*/*" -print0 | while IFS= read -r -d '' file; do
            chapter="$(basename "$(dirname "$file")")"
            cp "$file" "public/telechargements/cours/$chapter.md"
          done
          find content -mindepth 3 -maxdepth 3 -type f -name "*.md" -path "content/[0-9][0-9]-*/tp/*" ! -name "index.md" -exec cp {} public/telechargements/tp/ \;

      - name: Create Obsidian archive
        run: |
          mkdir -p download/Configuration-Maintenance-PC
          find content -mindepth 1 -maxdepth 1 -type d -name "[0-9][0-9]-*" -exec cp -R {} download/Configuration-Maintenance-PC/ \;
          cp -R content/cours download/Configuration-Maintenance-PC/
          cp -R content/assets download/Configuration-Maintenance-PC/
          cd download
          archive="../public/configuration-maintenance-pc-obsidian.zip"
          zip -qr "$archive" Configuration-Maintenance-PC

          markdown_count="$(unzip -Z1 "$archive" | grep -cE '\.md$' || true)"
          html_count="$(unzip -Z1 "$archive" | grep -cE '\.html$' || true)"
          if [ "$markdown_count" -eq 0 ] || [ "$html_count" -eq 0 ]; then
            echo "Archive incomplète : Markdown=$markdown_count, HTML=$html_count"
            exit 1
          fi

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
